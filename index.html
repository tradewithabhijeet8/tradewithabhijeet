function home(){
const feats=[["pa","Price Action","Understand how price behaves and how market structure develops."],["ta","Technical Analysis","Learn technical tools and how they can be combined into a structured analysis process."],["rm","Risk Management","Understand position sizing, stop-loss concepts and risk/reward."],["ps","Discipline","Build a systematic approach instead of making emotional decisions."]];
const steps=[["Understand","Learn the foundations."],["Analyse","Study market structure and technical concepts."],["Practice","Apply concepts to charts."],["Build","Develop structured trading setups."],["Execute","Learn disciplined decision-making and risk management."]];
const tt=CONFIG.testimonials.length?CONFIG.testimonials:[1,2,3].map(()=>({name:"Student name",text:"Real student testimonial will be added here.",ph:1}));
const ed=CONFIG.educators.map(e=>`<article class="glass ab rv">${e.photo?`<img src="${e.photo}" alt="${e.name}" loading="lazy" class="ph">`:`<div class="ph" role="img" aria-label="Photo placeholder for ${e.name}">Photo placeholder</div>`}<h3 style="text-transform:uppercase">${e.name}</h3><p style="color:var(--g);font-size:13px;letter-spacing:.1em;margin:4px 0 12px">${e.role.toUpperCase()}</p><p style="color:var(--mu);font-size:15px">${e.bio}</p></article>`).join("");
return `<div class="pg"><header class="hero"><div class="grid"></div><div class="glow"></div><div class="wrap hg"><div><span class="lbl">Trading Education • Price Action • Technical Analysis</span><h1>Read the market.<br><em>Trade with purpose.</em></h1><p class="sub" style="font-size:18px">Master Price Action, Technical Analysis, Risk Management and practical market analysis through structured trading education from Arya Mishra and Brijendra Tiwari.</p><div class="ctas"><a class="btn pri" href="#courses">Explore Courses</a>${wa("Chat on WhatsApp")}</div></div>${HERO_CHART}</div></header>
<section id="about" style="background:var(--bg2)"><div class="wrap sp"><div class="rv"><span class="lbl">Our approach</span><h2>Trading isn't about predicting every move.</h2><p class="sub">It's about understanding market behaviour, managing risk and building a structured process.</p></div><div class="glass chart rv">${STRUCT}<p class="note">Decorative illustration only.</p></div></div></section>
<section id="educators"><div class="wrap">${head("Educators","Meet your educators")}<div class="g3" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));max-width:820px">${ed}</div></div></section>
<section id="courses" style="background:var(--bg2)"><div class="wrap">${head("Programs","Choose your path","Structured learning paths. Trading involves risk; no course can guarantee profits.")}<div class="g3" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${COURSES.map(courseCard).join("")}</div>
<div class="glass cc feat rv" style="margin-top:22px;text-align:center;align-items:center;padding:40px 24px"><span class="badge" style="position:static;margin-bottom:14px">${PREMIUM.badge.toUpperCase()}</span><h3>${PREMIUM.title}</h3><p style="font-family:'Space Grotesk';letter-spacing:.06em;margin:10px 0">${PREMIUM.parts.join(" &nbsp;+&nbsp; ").toUpperCase()}</p><div class="pr" style="color:var(--g)">${PREMIUM.price?money(PREMIUM.price):"COMING SOON"}</div><a class="btn pri" data-wl target="_blank" rel="noopener" href="#">Join Waitlist</a></div>
<p class="disc" style="border:0">${CONFIG.disclaimer}</p></div></section>
<section id="why"><div class="wrap">${head("Why us","Built around real market concepts")}<div class="g4">${feats.map(f=>`<div class="glass fc rv">${icon(f[0])}<h3>${f[1]}</h3><p>${f[2]}</p></div>`).join("")}</div></div></section>
<section style="background:var(--bg2)"><div class="wrap">${head("Learning process","From foundations to disciplined execution")}<ol class="tl">${steps.map((x,i)=>`<li class="glass rv"><b>0${i+1}</b><h3>${x[0]}</h3><p>${x[1]}</p></li>`).join("")}</ol></div></section>
<section><div class="wrap">${head("Testimonials","Student feedback")}<div class="g3">${tt.map(x=>`<blockquote class="glass fc rv" ${x.ph?'style="border-style:dashed"':""}><p style="${x.ph?"color:var(--mu);font-style:italic":""}">“${x.text}”</p><p style="margin-top:12px;color:var(--g);font-size:13px">${x.ph?"Placeholder":x.name}</p></blockquote>`).join("")}</div></div></section>
<section id="faq" style="background:var(--bg2)"><div class="wrap"><div style="text-align:center">${head("FAQ","Common questions")}</div><div class="fq">${FAQS.map((f,i)=>`<div class="glass fi rv"><button aria-expanded="false" aria-controls="a${i}" id="q${i}">${f[0]}</button><div class="fa" id="a${i}" role="region" aria-labelledby="q${i}"><div>${f[1]}</div></div></div>`).join("")}</div></div></section>
<section id="contact"><div class="wrap"><div class="glass ct rv"><span class="lbl">Contact</span><h2>Ready to start learning?</h2><p class="sub" style="margin:0 auto">Have questions about our courses or enrollment? Speak with us directly.</p><div class="ctas">${wa("Chat on WhatsApp","btn pri")}<a class="btn" href="#courses">Explore Courses</a></div><p style="margin-top:18px;color:var(--mu);font-size:14px">${CONFIG.whatsappDisplay}</p></div></div></section></div>`}
function detail(id){
const c=COURSES.find(x=>x.id===id);if(!c)return `<div class="wrap det"><h2>Course not found</h2><a class="btn" href="#courses">View Courses</a></div>`;
return `<div class="wrap det pg"><a href="#courses" style="color:var(--mu);font-size:14px">← All courses</a><div class="dg"><div><span class="lbl">Course ${c.n}</span><h1 style="font-size:clamp(32px,5vw,56px)">${c.title}</h1><p class="sub" style="margin-top:16px;font-size:18px">${c.description}</p>
<h3>Who this course is for</h3><ul class="chk">${c.audience.map(x=>`<li>${x}</li>`).join("")}</ul>
<h3>What you will learn</h3><ul class="chk">${c.learn.map(x=>`<li>${x}</li>`).join("")}</ul>
<h3>Curriculum</h3><ol class="cur" style="padding:0">${c.curriculum.map(x=>`<li>${x}</li>`).join("")}</ol>
<h3>Learning outcomes</h3><ul class="chk">${c.outcomes.map(x=>`<li>${x}</li>`).join("")}</ul>
<h3>Course details</h3><p style="color:var(--mu)">Duration: ${c.duration}<br>Format: ${c.format}</p>
<h3>Enrollment process</h3><ol class="chk" style="padding:0"><li>Click Enroll Now and fill in your details</li><li>Review the order summary</li><li>Continue on WhatsApp</li><li>Receive payment and enrollment details there</li></ol><h3>FAQ</h3><div>${FAQS.slice(0,4).map((f,i)=>`<div class="glass fi" style="margin-bottom:10px"><button aria-expanded="false" aria-controls="d${i}" id="dq${i}">${f[0]}</button><div class="fa" id="d${i}" role="region" aria-labelledby="dq${i}"><div>${f[1]}</div></div></div>`).join("")}</div><p class="disc">${CONFIG.disclaimer}</p></div>
<aside class="glass pc" aria-label="Pricing"><span class="lbl">${c.badge||"Course"}</span><h3 style="text-transform:uppercase;font-size:20px">${c.title}</h3><div class="big" style="margin-top:14px">${money(c.price)}</div><p class="mt">One-time payment</p><button class="btn pri" style="width:100%" data-enroll="${c.id}">Enroll Now</button><p class="mt" style="margin:14px 0 0">No online payment on this site. You'll continue on WhatsApp for payment details.</p></aside></div></div>`}
/* ============ router & interactions ============ */
const app=$("#app");
function bindReveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".rv").forEach(el=>io.observe(el))}
function bindFaq(){document.querySelectorAll(".fi button").forEach(b=>b.onclick=()=>{const p=b.parentElement,o=p.classList.toggle("o");b.setAttribute("aria-expanded",o)})}
function bindWA(){document.querySelectorAll("[data-wl]").forEach(a=>a.href="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent("Hello Trade With Abhijeet, I would like to join the waitlist for The Complete Trading Program."));document.querySelectorAll("[data-wa]").forEach(a=>a.href=generateWhatsAppLink(null))}
function route(){
  const h=location.hash,m=h.match(/^#\/course\/(.+)$/);
  $("#mob").classList.remove("on");$("#bg").setAttribute("aria-expanded","false");
  if(m){app.innerHTML=detail(m[1]);window.scrollTo(0,0);document.title=`${(COURSES.find(c=>c.id===m[1])||{title:"Course"}).title} | ${CONFIG.brand}`}
  else{const sec=h.replace("#","");if(!$("#courses")||app.dataset.p!=="home")app.innerHTML=home();app.dataset.p="home";document.title=`Trade With Abhijeet | Price Action & Technical Analysis`;
    if(sec&&!sec.startsWith("/")){setTimeout(()=>document.getElementById(sec)?.scrollIntoView(),30)}else window.scrollTo(0,0)}
  if(m)app.dataset.p="detail";
  bindReveal();bindFaq();bindWA();
  document.querySelectorAll("[data-enroll]").forEach(b=>b.onclick=()=>checkout(b.dataset.enroll));
}
addEventListener("hashchange",route);
addEventListener("scroll",()=>$("#nav").classList.toggle("sc",scrollY>20),{passive:true});
$("#bg").onclick=()=>{const o=$("#mob").classList.toggle("on");$("#bg").setAttribute("aria-expanded",o)};
/* modal */
const md=$("#md"),mb=$("#mbody");
const close=()=>md.classList.remove("on");
md.onclick=e=>{if(e.target===md)close()};
addEventListener("keydown",e=>{if(e.key==="Escape")close()});
function checkout(id){
  const c=COURSES.find(x=>x.id===id);
  mb.innerHTML=`<button class="x" aria-label="Close" onclick="close_()">×</button><h3 id="mt">Enroll: ${c.title}</h3>
  <form id="cf" novalidate>
  <label for="fn">Full name</label><input id="fn" autocomplete="name" required><div class="er" id="e1"></div>
  <label for="fp">WhatsApp number</label><input id="fp" type="tel" inputmode="tel" autocomplete="tel" placeholder="+91 98765 43210" required><div class="er" id="e2"></div>
  <label for="fe">Email</label><input id="fe" type="email" autocomplete="email" required><div class="er" id="e3"></div>
  <label for="fs">Selected course</label><select id="fs">${COURSES.map(x=>`<option value="${x.id}" ${x.id===id?"selected":""}>${x.title}</option>`).join("")}</select>
  <label for="fm">Message (optional)</label><textarea id="fm" rows="2" maxlength="300"></textarea>
  <div class="sm" aria-live="polite"><div><span>Course</span><b id="sc"></b></div><div><span>Price</span><span id="sp"></span></div><div style="border-top:1px solid var(--bd);margin-top:6px;padding-top:8px"><b>Total</b><b id="st" style="color:var(--g)"></b></div></div>
  <button class="btn pri" style="width:100%;font-size:15px;padding:17px">Continue on WhatsApp</button>
  <p style="font-size:12px;color:var(--mu);margin-top:12px">Your details are only used to prefill a WhatsApp message to us. Nothing is stored on this website.</p><p style="font-size:11px;color:var(--mu);margin-top:10px;line-height:1.6">${CONFIG.disclaimer}</p></form>`;
  const upd=()=>{const s=COURSES.find(x=>x.id===$("#fs").value);$("#sc").textContent=s.title;$("#sp").textContent=$("#st").textContent=money(s.price)};
  $("#fs").onchange=upd;upd();md.classList.add("on");$("#fn").focus();
  $("#cf").onsubmit=e=>{e.preventDefault();
    const name=$("#fn").value.trim(),phone=$("#fp").value.trim(),email=$("#fe").value.trim();
    const e1=name.length<2?"Please enter your full name.":"",
      e2=!/^\+?[\d\s\-]{10,15}$/.test(phone)?"Enter a valid number (10–15 digits).":"",
      e3=!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)?"Enter a valid email address.":"";
    $("#e1").textContent=e1;$("#e2").textContent=e2;$("#e3").textContent=e3;
    if(e1||e2||e3)return;
    const s=COURSES.find(x=>x.id===$("#fs").value);
    window.open(generateWhatsAppLink(s,{name,phone,email,msg:$("#fm").value.trim()}),"_blank","noopener");
  };
}
function close_(){close()}
function legal(k){mb.innerHTML=`<button class="x" aria-label="Close" onclick="close_()">×</button><h3 id="mt">${{privacy:"Privacy Policy",terms:"Terms & Conditions",disclaimer:"Disclaimer"}[k]}</h3><p style="color:var(--mu)">${k==="disclaimer"?CONFIG.disclaimer:CONFIG.legal[k]}</p>`;md.classList.add("on")}
document.querySelectorAll("[data-legal]").forEach(a=>a.onclick=e=>{e.preventDefault();legal(a.dataset.legal)});
/* init brand */
const B=CONFIG.brand;
$("#logo").innerHTML=B.replace(/(\S+)$/,"<b>$1</b>");$("#flogo").textContent=B;
$("#disclaimer").textContent="Disclaimer: "+CONFIG.disclaimer;
$("#copy").textContent=`© 2026 ${B.charAt(0)+B.slice(1).toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())}. All rights reserved.`;
$("#fwa").textContent=CONFIG.whatsappDisplay;
route();
</script>
</body>
</html>
